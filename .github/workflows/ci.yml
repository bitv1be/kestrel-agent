name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Race tests
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Benchmarks
        run: go test -run '^$' -bench . -benchmem ./internal/...

  static-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o agent-linux-${{ matrix.arch }} ./cmd/agent
      - name: Verify ELF
        run: |
          file agent-linux-${{ matrix.arch }}
          file agent-linux-${{ matrix.arch }} | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-linux-${{ matrix.arch }}
          path: agent-linux-${{ matrix.arch }}

  image:
    runs-on: ubuntu-latest
    needs: [test, static-build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,riscv64
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64
          tags: kestrel-agent:ci
          outputs: type=oci,dest=/tmp/kestrel-agent.tar
          build-args: |
            FULL=0
            VERSION=${{ github.sha }}

  emulated-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}
      - name: Run Go tests under QEMU
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            --mount type=bind,source="$PWD",target=/src -w /src \
            golang:1.27.1 sh -c 'CGO_ENABLED=0 go test ./...'

  image-smoke:
    runs-on: ubuntu-latest
    needs: image
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,riscv64
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test image
        run: |
          docker buildx build --load --platform linux/${{ matrix.arch }} -f deploy/Dockerfile \
            --build-arg FULL=0 -t kestrel-agent:smoke .
          docker run --rm --platform linux/${{ matrix.arch }} \
            --entrypoint /bin/bash kestrel-agent:smoke -ec \
            'test "$(id -un)" = agent; for tool in bash curl git jq rg python3 node sqlite3; do command -v "$tool" >/dev/null; done; agent version'
